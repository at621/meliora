name: Python CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest --cov=meliora --cov-report=term-missing

  docs-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: python scripts/check_catalog.py
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - run: python -m sphinx -W -b doctest docs/source docs/_build/doctest
      - run: python scripts/run_notebooks.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py

      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pytest
