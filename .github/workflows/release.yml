name: Release to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.2.0
        required: true
        type: string
      publish:
        description: Upload the validated packages to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      WORKFLOW_REF: ${{ github.ref }}
    steps:
      - name: Validate release selection
        shell: bash
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the release commit to belong to main
        id: commit
        run: |
          git merge-base --is-ancestor HEAD origin/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check src tests scripts
      - run: python scripts/check_catalog.py
      - run: python -m sphinx -W --keep-going -b html docs/source docs/_build/html
      - run: python -m sphinx -W -b doctest docs/source docs/_build/doctest
      - run: python scripts/run_notebooks.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  test-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.13'
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Install the built wheel in a fresh environment
        run: >-
          python -c "import glob, subprocess, sys;
          wheel = glob.glob('dist/*.whl')[0];
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel + '[test]'])"
      - run: python -m pytest --cov=meliora --cov-report=term-missing

  check-credentials:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require a PyPI API token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_PASSWORD }}
        shell: bash
        run: |
          if [[ "$PYPI_API_TOKEN" != pypi-* ]]; then
            echo 'Set PYPI_PASSWORD to a PyPI API token scoped to the meliora project.'
            exit 1
          fi
          echo 'A PyPI API token is configured. Authorization is verified by PyPI only during upload.'

  publish:
    if: ${{ inputs.publish }}
    needs: [build, test-wheel, check-credentials]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Publish the tested artifacts
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          password: ${{ secrets.PYPI_PASSWORD }}
          attestations: false
