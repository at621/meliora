[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "meliora"
dynamic = ["version"]
description = "Statistical tools for credit risk model validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anton Treialt", email = "anton.treialt@aistat.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3"]

[project.urls]
Repository = "https://github.com/at621/meliora"
Issues = "https://github.com/at621/meliora/issues"
Documentation = "https://github.com/at621/meliora/tree/main/docs"
Changelog = "https://github.com/at621/meliora/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
docs = ["sphinx>=7,<9", "myst-parser>=3,<5", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"]
dev = ["meliora[test,docs]", "ruff>=0.11", "build>=1.2", "twine>=6"]

[tool.flit.module]
name = "meliora"

[tool.flit.sdist]
include = ["tests/", "docs/source/", "docs/README.md", "docs/method_catalog.json", "docs/method_checklist.md", "examples/", "scripts/", "CHANGELOG.md", "CONTRIBUTING.md"]
exclude = [".github/", "docs/_build/", "build/", "dist/", "**/__pycache__/", "**/.ipynb_checkpoints/", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["meliora"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/source/conf.py" = ["D"]
"*.ipynb" = ["D", "E402", "F401"]
