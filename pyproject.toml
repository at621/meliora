[build-system]
requires = ["flit_core>=4.0.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "meliora"
dynamic = ["version"]
description = "Statistical tools for credit risk model validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Anton Treialt", email = "anton.treialt@aistat.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["numpy>=2.4.6", "pandas>=3.0.5", "scipy>=1.17.1", "scikit-learn>=1.9.0"]

[project.urls]
Repository = "https://github.com/at621/meliora"
Issues = "https://github.com/at621/meliora/issues"
Documentation = "https://github.com/at621/meliora/blob/v0.2/docs/README.md"
Changelog = "https://github.com/at621/meliora/blob/v0.2/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8"]
docs = ["sphinx>=9.0.4,<10", "myst-parser>=5.1.0,<6", "nbformat>=5.11.1", "nbclient>=0.11.0", "ipykernel>=7.3.0"]
dev = ["meliora[test,docs]", "ruff>=0.16.6", "build>=1.6.0", "twine>=7.0.0", "readme-renderer[md]>=46"]

[tool.flit.module]
name = "meliora"

[tool.flit.sdist]
include = ["tests/", "docs/source/", "docs/README.md", "docs/method_catalog.json", "docs/method_checklist.md", "examples/", "scripts/", "CHANGELOG.md", "CONTRIBUTING.md"]
exclude = [".github/", "docs/_build/", "build/", "dist/", "**/__pycache__/", "**/.ipynb_checkpoints/", "**/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["meliora"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"docs/source/conf.py" = ["D"]
"*.ipynb" = ["D", "E402", "F401"]
