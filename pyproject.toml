[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meliora"
dynamic = ["version"]
description = "Companion calculations for Statistical Tests for Credit Risk"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
notebook = ["matplotlib>=3.8", "jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbconvert>=7,<8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["meliora"]

[tool.setuptools.dynamic]
version = {attr = "meliora.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
